name: Nightly

on:
  schedule:
    # 03:23 Asia/Shanghai. Avoid the busy start of the hour.
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Maintainer confirmation after disabling repository release immutability.
  NIGHTLY_ROLLING_ENABLED: ${{ vars.NIGHTLY_ROLLING_ENABLED }}

jobs:
  prepare:
    if: github.repository == 'davisye/aigate-cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      version: ${{ steps.build.outputs.version }}
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check rolling release opt-in
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-nightly.sh --check
      - name: Pin the commit and identify the build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          version=$(cargo metadata --locked --offline --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "aigate-cli") | .version')
          previous=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "nightly" and .draft == false) | .body')
          changed=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] && grep -Fqx "Commit: $sha" <<< "$previous"; then
            changed=false
          fi
          printf 'sha=%s\nversion=%s-nightly.%s+%s\nchanged=%s\n' \
            "$sha" "$version" "$(date -u +%Y%m%d)" "${sha:0:12}" "$changed" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  binaries:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      AIGATE_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      BUILD_TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libdbus-1-dev
      - name: Install the pinned Rust toolchain and target
        run: rustup target add ${{ matrix.target }}
      - name: Build native release binary
        run: cargo build --release --locked --bin aigate-cli --target ${{ matrix.target }}
      - name: Package and smoke test Unix binary
        if: runner.os != 'Windows'
        run: bash scripts/package-nightly.sh "$BUILD_TARGET" "$AIGATE_BUILD_VERSION" "$RELEASE_SHA"
      - name: Package and smoke test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/$env:BUILD_TARGET/release/aigate-cli.exe"
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "aigate-cli $env:AIGATE_BUILD_VERSION") {
            throw "Unexpected binary version: $version"
          }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'Help smoke test failed' }
          & $binary regions --json
          if ($LASTEXITCODE -ne 0) { throw 'Offline smoke test failed' }
          New-Item -ItemType Directory -Path dist, staging | Out-Null
          Copy-Item $binary staging/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md, CHANGELOG.md staging/
          @("Version: $env:AIGATE_BUILD_VERSION", "Commit: $env:RELEASE_SHA", "Target: $env:BUILD_TARGET") |
            Set-Content -Encoding utf8 staging/BUILD-INFO.txt
          Compress-Archive -Path staging/* -DestinationPath "dist/aigate-cli-nightly-$env:BUILD_TARGET.zip"
          Expand-Archive -Path "dist/aigate-cli-nightly-$env:BUILD_TARGET.zip" -DestinationPath unpacked
          $version = & ./unpacked/aigate-cli.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "aigate-cli $env:AIGATE_BUILD_VERSION") {
            throw 'Packaged binary smoke test failed'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      AIGATE_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-*
          merge-multiple: true
          path: dist/
      - name: Prepare source, checksums and notes
        run: |
          git archive --format=tar --prefix=aigate-cli-nightly/ "$RELEASE_SHA" | gzip -n > dist/aigate-cli-nightly-source.tar.gz
          (
            cd dist
            sha256sum aigate-cli-nightly-*.tar.gz aigate-cli-nightly-*.zip > SHA256SUMS
          )
          {
            printf '# AIGate CLI nightly\n\n'
            printf '自动构建的预发行版，固定下载地址会随成功构建更新。\n\n'
            printf 'Version: %s\n\nCommit: %s\n\n' "$AIGATE_BUILD_VERSION" "$RELEASE_SHA"
            printf '[变更记录](https://github.com/%s/blob/%s/CHANGELOG.md) · [构建记录](https://github.com/%s/actions/runs/%s)\n\n' \
              "$GH_REPO" "$RELEASE_SHA" "$GH_REPO" "$GITHUB_RUN_ID"
            printf 'Linux x86_64：Ubuntu 24.04 / glibc 2.39 构建基线，需要 libdbus-1-3。\n\n'
            printf 'Windows x64：MSVC；macOS：Apple Silicon / macOS 15 构建基线。\n\n'
            printf '二进制未签名或公证；桌面凭证库与真实 API 功能仍需实机验收。解压后运行 --version，使用 SHA256SUMS 校验下载文件。\n'
          } > dist/RELEASE_NOTES.md
      - name: Publish the verified rolling prerelease
        run: bash scripts/publish-nightly.sh "$RELEASE_SHA" dist
