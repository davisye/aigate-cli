name: Build binaries

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build
        required: true
        type: string
      version:
        description: Version embedded in the binary
        required: true
        type: string
      archive_label:
        description: Archive label (nightly or the package version)
        required: true
        type: string
      linux_packages:
        description: Build Linux installation packages alongside the archives
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      AIGATE_BUILD_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ inputs.ref }}
      BUILD_TARGET: ${{ matrix.target }}
      ARCHIVE_LABEL: ${{ inputs.archive_label }}
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libdbus-1-dev
      - name: Install the pinned Rust toolchain and target
        run: rustup target add ${{ matrix.target }}
      - name: Build native release binary
        run: cargo build --release --locked --bin aigate-cli --target ${{ matrix.target }}
      - name: Package and smoke test Unix binary
        if: runner.os != 'Windows'
        run: bash scripts/package-binary.sh "$BUILD_TARGET" "$AIGATE_BUILD_VERSION" "$RELEASE_SHA" "$ARCHIVE_LABEL"
      - name: Package and smoke test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/$env:BUILD_TARGET/release/aigate-cli.exe"
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "aigate-cli $env:AIGATE_BUILD_VERSION") {
            throw "Unexpected binary version: $version"
          }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'Help smoke test failed' }
          & $binary regions --json
          if ($LASTEXITCODE -ne 0) { throw 'Offline smoke test failed' }
          New-Item -ItemType Directory -Path dist, staging | Out-Null
          Copy-Item $binary staging/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md, CHANGELOG.md staging/
          @("Version: $env:AIGATE_BUILD_VERSION", "Commit: $env:RELEASE_SHA", "Target: $env:BUILD_TARGET") |
            Set-Content -Encoding utf8 staging/BUILD-INFO.txt
          Compress-Archive -Path staging/* -DestinationPath "dist/aigate-cli-$env:ARCHIVE_LABEL-$env:BUILD_TARGET.zip"
          Expand-Archive -Path "dist/aigate-cli-$env:ARCHIVE_LABEL-$env:BUILD_TARGET.zip" -DestinationPath unpacked
          $version = & ./unpacked/aigate-cli.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "aigate-cli $env:AIGATE_BUILD_VERSION") {
            throw 'Packaged binary smoke test failed'
          }
      - name: Build and check Linux installation packages
        if: runner.os == 'Linux' && inputs.linux_packages
        run: |
          nfpm_version=2.49.0
          case "$BUILD_TARGET" in
            x86_64-unknown-linux-gnu)
              nfpm_arch=x86_64
              nfpm_sha=2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7
              deb_arch=amd64
              ;;
            aarch64-unknown-linux-gnu)
              nfpm_arch=arm64
              nfpm_sha=d4eee71839e92c68cbd3b101640bad32d2856fc551acae0635be9118e48c9d9c
              deb_arch=arm64
              ;;
            *) exit 1 ;;
          esac
          tool_dir=$(mktemp -d)
          trap 'rm -rf -- "$tool_dir"' EXIT
          nfpm_asset="nfpm_${nfpm_version}_Linux_$nfpm_arch.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/goreleaser/nfpm/releases/download/v$nfpm_version/$nfpm_asset" \
            --output "$tool_dir/$nfpm_asset"
          printf '%s  %s\n' "$nfpm_sha" "$tool_dir/$nfpm_asset" | sha256sum --strict --check
          tar -xzf "$tool_dir/$nfpm_asset" -C "$tool_dir" nfpm
          NFPM_BIN="$tool_dir/nfpm" bash scripts/package-linux.sh "$BUILD_TARGET" "$AIGATE_BUILD_VERSION"
          sudo dpkg --install "dist/aigate-cli-$AIGATE_BUILD_VERSION-$deb_arch.deb"
          test "$(/usr/bin/aigate-cli --version)" = "aigate-cli $AIGATE_BUILD_VERSION"
          /usr/bin/aigate-cli regions --json
          sudo dpkg --remove aigate-cli
          test ! -e /usr/bin/aigate-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.archive_label }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
