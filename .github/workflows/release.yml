name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z, vX.Y.Z-alpha.N, vX.Y.Z-beta.N, or vX.Y.Z-rc.N tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'davisye/aigate-cli' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version and source tree
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bash scripts/prepare-release.sh --check "$RELEASE_TAG"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\nversion=%s\n' "$RELEASE_TAG" "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ $RELEASE_TAG == *-* ]]; then
            printf 'prerelease=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'prerelease=false\n' >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  package:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare source archive and release notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bash scripts/prepare-release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: dist/
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [validate, package]
    if: needs.validate.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: dist/
      - name: Sign source release checksums
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_PRIMARY_FINGERPRINT: 4DB25C5D9BB79A946A5DBAD9125042501C150D43
          RELEASE_GPG_SIGNING_FINGERPRINT: ${{ vars.RELEASE_GPG_SIGNING_FINGERPRINT }}
        run: bash scripts/sign-release.sh dist
      - name: Verify archive and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "AIGate CLI $RELEASE_TAG" --notes-file RELEASE_NOTES.md \
            "aigate-cli-${RELEASE_TAG#v}-source.tar.gz" SHA256SUMS SHA256SUMS.asc aigate-cli-release-key.asc

  binaries:
    needs: [validate, checks]
    if: needs.validate.outputs.prerelease == 'true'
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      version: ${{ needs.validate.outputs.version }}
      archive_label: ${{ needs.validate.outputs.version }}

  prerelease:
    needs: [validate, package, binaries]
    if: needs.validate.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.validate.outputs.version }}-*
          merge-multiple: true
          path: dist/
      - name: Assemble and verify release checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd dist
          assets=(
            "aigate-cli-$RELEASE_VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "aigate-cli-$RELEASE_VERSION-aarch64-unknown-linux-gnu.tar.gz"
            "aigate-cli-$RELEASE_VERSION-x86_64-pc-windows-msvc.zip"
            "aigate-cli-$RELEASE_VERSION-aarch64-apple-darwin.tar.gz"
            "aigate-cli-$RELEASE_VERSION-source.tar.gz"
          )
          for file in "${assets[@]}"; do test -s "$file"; done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --strict --check SHA256SUMS
      - name: Sign release checksums
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_PRIMARY_FINGERPRINT: 4DB25C5D9BB79A946A5DBAD9125042501C150D43
          RELEASE_GPG_SIGNING_FINGERPRINT: ${{ vars.RELEASE_GPG_SIGNING_FINGERPRINT }}
        run: bash scripts/sign-release.sh dist
      - name: Publish and verify the tagged prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd dist
          assets=(
            "aigate-cli-$RELEASE_VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "aigate-cli-$RELEASE_VERSION-aarch64-unknown-linux-gnu.tar.gz"
            "aigate-cli-$RELEASE_VERSION-x86_64-pc-windows-msvc.zip"
            "aigate-cli-$RELEASE_VERSION-aarch64-apple-darwin.tar.gz"
            "aigate-cli-$RELEASE_VERSION-source.tar.gz"
          )
          sha256sum --strict --check SHA256SUMS
          printf '\nCommit: %s\n\n[构建记录](https://github.com/%s/actions/runs/%s)\n' \
            "$RELEASE_SHA" "$GH_REPO" "$GITHUB_RUN_ID" >> RELEASE_NOTES.md
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
            --title "AIGate CLI $RELEASE_TAG" --notes-file RELEASE_NOTES.md \
            "${assets[@]}" SHA256SUMS SHA256SUMS.asc aigate-cli-release-key.asc
          gh release download "$RELEASE_TAG" --dir ../verified
          cmp SHA256SUMS ../verified/SHA256SUMS
          cmp SHA256SUMS.asc ../verified/SHA256SUMS.asc
          cmp aigate-cli-release-key.asc ../verified/aigate-cli-release-key.asc
          (cd ../verified && sha256sum --strict --check SHA256SUMS)
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
