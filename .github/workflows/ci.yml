name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check for release preparation
        required: false
        type: string
        default: ''
      audit_only:
        description: Run only the dependency audit
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  AIGATE_REQUIRE_SHELLS: '1'

jobs:
  checks:
    name: Linux checks
    env:
      AIGATE_REQUIRE_LUA: '1'
    if: ${{ !inputs.audit_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install native and shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config zsh fish lua5.4 gnupg
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check, test and build
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          sh tests/makefile.sh
          bash tests/release.sh
          bash tests/release-signing.sh
          bash tests/nightly.sh
          cargo build --release --locked --bin aigate-cli
          target/release/aigate-cli --version
          cargo package --list --locked

  native:
    name: ${{ matrix.name }} checks
    env:
      AIGATE_REQUIRE_POWERSHELL: ${{ matrix.name == 'Windows' && '1' || '0' }}
      AIGATE_REQUIRE_NUSHELL: ${{ matrix.name == 'macOS' && '1' || '0' }}
      AIGATE_REQUIRE_LUA: ${{ matrix.name != 'Windows' && '1' || '0' }}
    if: ${{ !inputs.audit_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: macOS
            os: macos-15
          - name: Linux ARM64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install ARM64 Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config zsh fish lua5.4
      - name: Install macOS shell dependencies
        if: runner.os == 'macOS'
        run: brew install fish nushell lua
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run native tests
        run: cargo test --locked --all-targets

  powershell-version-comparison:
    name: PowerShell ${{ matrix.version }} ARM64 trial ${{ matrix.trial }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['7.6.9', '7.6.10']
        trial: [1, 2, 3, 4]
    env:
      AIGATE_REQUIRE_SHELLS: '1'
      AIGATE_REQUIRE_POWERSHELL: '1'
      AIGATE_REQUIRE_LUA: '1'
      PWSH_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ARM64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config zsh fish lua5.4
      - name: Install official PowerShell release
        run: |
          case "$PWSH_VERSION" in
            7.6.9) expected=02eb9991af447c7e7fe881acde195961afd397c40b8eb1c2b3856b84ec2d85f2 ;;
            7.6.10) expected=439432cdecf4418413b9a8f547e3ab4d9b40e8e4258913ec3d15fc92c67a9235 ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/powershell-$PWSH_VERSION-linux-arm64.tar.gz"
          curl --fail --location --retry 3 "https://github.com/PowerShell/PowerShell/releases/download/v$PWSH_VERSION/powershell-$PWSH_VERSION-linux-arm64.tar.gz" --output "$archive"
          echo "$expected  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
      - name: Identify environment
        run: |
          command -v pwsh
          pwsh --version
          rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run native tests once
        run: cargo test --locked --all-targets

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the lockfile
        run: cargo audit --file Cargo.lock
