name: aigate-cli
arch: ${AIGATE_PACKAGE_ARCH}
version: ${AIGATE_PACKAGE_VERSION}
version_schema: none
release: "1"
maintainer: AIGate CLI maintainers <50211095+DavisYe@users.noreply.github.com>
description: Command-line client for AIGate compute resources and generation tasks
homepage: https://github.com/davisye/aigate-cli
license: Apache-2.0
section: utils
priority: optional

contents:
  - src: ${AIGATE_PACKAGE_STAGE}/aigate-cli
    dst: /usr/bin/aigate-cli
    expand: true
    file_info:
      mode: 0755
  - src: ${AIGATE_PACKAGE_STAGE}/docs/
    dst: /usr/share/doc/aigate-cli/
    type: tree
    expand: true
  - src: ${AIGATE_PACKAGE_STAGE}/docs/LICENSE
    dst: /usr/share/doc/aigate-cli/copyright
    packager: deb
    expand: true
  - src: ${AIGATE_PACKAGE_STAGE}/docs/LICENSE
    dst: /usr/share/licenses/aigate-cli/LICENSE
    packager: rpm
    expand: true
  - src: ${AIGATE_PACKAGE_STAGE}/docs/LICENSE
    dst: /usr/share/licenses/aigate-cli/LICENSE
    packager: archlinux
    expand: true

overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libdbus-1-3
      - libgcc-s1
  rpm:
    depends:
      - glibc >= 2.39
      - libdbus-1.so.3()(64bit)
      - libgcc_s.so.1()(64bit)
  archlinux:
    depends:
      - glibc>=2.39
      - dbus
      - libgcc

archlinux:
  packager: AIGate CLI maintainers <50211095+DavisYe@users.noreply.github.com>
